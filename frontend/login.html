<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #8999a7, #87a2a3);
    }

    .login-container{
      background:white;
      padding:40px;
      width:350px;
      border-radius:12px;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    .login-container h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box label{
      display:block;
      margin-bottom:6px;
      color:#555;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      background:#4facfe;
      color:white;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
    }

    .login-btn:hover{
      background:#008cdd;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>Login</h2>

    <form action="register.html">

      <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>
  </div>

</body>
</html>
