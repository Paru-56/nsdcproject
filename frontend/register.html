<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right,rgb(129, 162, 168),rgb(140, 181, 184));
    }

    .register-container{
      background: white;
      padding: 40px;
      width: 380px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .register-container h2{
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-box{
      margin-bottom: 18px;
    }

    .input-box label{
      display: block;
      margin-bottom: 6px;
      color: #555;
    }

    .input-box input{
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
    }

    .input-box input:focus{
      border-color: #4facfe;
      box-shadow: 0 0 5px rgba(79,172,254,0.5);
    }

    .register-btn{
      width: 100%;
      padding: 12px;
      border: none;
      background: #4facfe;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-btn:hover{
      background: #008cdd;
    }

    .extra-links{
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .extra-links a{
      text-decoration: none;
      color: #4facfe;
    }

    .extra-links a:hover{
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="register-container">
    <h2>Create Account</h2>

    <form>

      <div class="input-box">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>
      </div>

      <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="register-btn">
        Register
      </button>

      <div class="extra-links">
        <p>Already have an account?
          <a href="/login.html">Login</a>
        </p>
      </div>

    </form>
  </div>

</body>
</html>
